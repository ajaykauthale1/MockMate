[workspace]
members = [
    "mockmate-core",
    "mockmate-audio",
    "mockmate-tts",
    "mockmate-llm",
    "mockmate-viseme",
    "mockmate-session",
    "mockmate-bridge",
    "mockmate-sidecar",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MockMate Contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
